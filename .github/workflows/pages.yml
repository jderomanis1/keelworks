name: Deploy GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Stage public site only
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # Public allowlist: index.html, css/, js/, assets/ (incl. fonts).
          # Never stage prototype/, SPEC.md, STATE.md, POSITIONING, legal, ux docs.
          test -f index.html
          cp index.html _site/
          mkdir -p _site/css _site/js _site/assets
          cp -r css/. _site/css/
          cp -r js/. _site/js/
          if [ -d assets ]; then cp -r assets/. _site/assets/; fi

          # Decode self-hosted fonts from text .b64 (MCP cannot push binary woff2 intact)
          if [ -d assets/fonts ]; then
            mkdir -p _site/assets/fonts
            for b64 in assets/fonts/*.woff2.b64; do
              [ -f "$b64" ] || continue
              base=$(basename "$b64" .b64)
              base64 -d "$b64" > "_site/assets/fonts/$base"
            done
            # Also copy OFL txt / README
            cp -f assets/fonts/*.txt _site/assets/fonts/ 2>/dev/null || true
            cp -f assets/fonts/README.md _site/assets/fonts/ 2>/dev/null || true
          fi
          # Drop text b64 from artifact once decoded
          rm -f _site/assets/fonts/*.woff2.b64 2>/dev/null || true
          test -f _site/index.html
          test -d _site/css
          test -d _site/js
          # Fonts expected when self-hosted
          if [ -d assets/fonts ]; then
            test -d _site/assets/fonts
          fi
          if [ -e _site/prototype ] || [ -e _site/SPEC.md ] || [ -e _site/STATE.md ] || [ -e _site/POSITIONING.md ] || [ -e _site/SA-DECISION.md ]; then
            echo "Refuse: non-public path leaked into _site" >&2
            exit 1
          fi
          # Explicitly ensure docs never copied even if present at repo root
          rm -f _site/SPEC.md _site/STATE.md _site/POSITIONING.md _site/SA-DECISION.md _site/SCOUT.md _site/README.md 2>/dev/null || true
          rm -rf _site/prototype _site/ux _site/screenshots 2>/dev/null || true
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
