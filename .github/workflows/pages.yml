name: Deploy GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Stage public site only
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          if [ -f index.html ]; then
            cp index.html _site/
            [ -d css ] && mkdir -p _site/css && cp -r css/. _site/css/
            [ -d js ] && mkdir -p _site/js && cp -r js/. _site/js/
            [ -d assets ] && mkdir -p _site/assets && cp -r assets/. _site/assets/
          elif [ -d prototype ]; then
            cp -r prototype/. _site/
          else
            printf '%s\n' '<!DOCTYPE html><title>Keelworks</title><p>Deploy pending</p>' > _site/index.html
          fi
          test -f _site/index.html
          if [ -e _site/SPEC.md ] || [ -e _site/STATE.md ]; then
            echo "Refuse: non-public path leaked into _site" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
